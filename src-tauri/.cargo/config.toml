# Статическая линковка рантайма Visual C++ (MSVC).
#
# Без этого готовый .exe зависит от системных vcruntime140.dll /
# vcruntime140_1.dll / msvcp140.dll — они обычно уже есть на компьютере
# разработчика (стоит Visual Studio / VC++ Redistributable), но их НЕТ
# на чистой Windows без единого установленного приложения для разработки.
# Именно поэтому exe падал с ошибкой "не обнаружена VCRUNTIME140_1.dll"
# на новых/чистых ноутбуках.
#
# С этим флагом Rust вшивает нужный код рантайма прямо в сам .exe —
# файл становится полностью самодостаточным, никаких внешних
# зависимостей на целевой машине не требуется.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
