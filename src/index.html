<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Echips Driver Assistant</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<div class="device">
  <header class="titlebar">
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button type="button" class="titlebar-btn" id="win-minimize" title="Свернуть" aria-label="Свернуть">
        <svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5"/></svg>
      </button>
      <button type="button" class="titlebar-btn titlebar-btn-close" id="win-close" title="Закрыть" aria-label="Закрыть">
        <svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
      </button>
    </div>
  </header>

  <div id="update-banner" class="update-banner" style="display:none;"></div>

  <div class="body">
    <aside class="sidebar">
      <div class="brand">
        <img class="mark" src="logo.png" alt="Echips">
        <div class="brandtext">
          <div class="h">Echips Driver<br>Assistant</div>
          <div class="s" id="version-label">v1.0.0</div>
        </div>
      </div>

      <nav class="steps">
        <div class="step" data-step="1"><span class="dot"></span>Определение</div>
        <div class="step" data-step="2"><span class="dot"></span>Выбор</div>
        <div class="step" data-step="3"><span class="dot"></span>Установка</div>
        <div class="step" data-step="4"><span class="dot"></span>Готово</div>
      </nav>

      <div class="footer">
        <span class="c">© Echips</span>
        <button class="footer-link" id="site-link" type="button">echips.ru</button>
      </div>
    </aside>

    <div class="content">
      <div class="screen" id="screen"></div>
    </div>
  </div>
</div>

<script src="titlebar.js"></script>
<script src="app.js"></script>
</body>
</html>
